# Isolated operations tests: all storage is in project-scoped disposable volumes.
services:
  bronko.media.tls:
    image: ${BRONKO_TEST_IMAGE:-ci/dummy:test}
    user: "0:0"
    entrypoint: [/bronko.media/script/init_mysql_tls]
    volumes:
      - mysql_tls:/mysql-tls
      - mysql_ca:/mysql-ca
  bronko.media.server:
    image: ${BRONKO_TEST_IMAGE:-ci/dummy:test}
    environment:
      DB_SSL_CA: /mysql-ca/ca.pem
    volumes:
      - mysql_ca:/mysql-ca:ro
      - originals:/bronko.media/data/images
      - thumbnails:/bronko.media/public/images/thumbs
    depends_on:
      bronko.media.db:
        condition: service_healthy
  bronko.media.db:
    image: docker.io/library/mysql:8.0.34
    command: --default-authentication-plugin=mysql_native_password --ssl-ca=/etc/mysql/tls/ca.pem --ssl-cert=/etc/mysql/tls/server-cert.pem --ssl-key=/etc/mysql/tls/server-key.pem
    depends_on:
      bronko.media.tls:
        condition: service_completed_successfully
    environment:
      MYSQL_ROOT_PASSWORD: integration_only
      MYSQL_PASSWORD: password
      MYSQL_USER: bronko
      MYSQL_DATABASE: BronkoMediaServer
    volumes:
      - mysql_tls:/etc/mysql/tls:ro
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, --silent]
      interval: 2s
      timeout: 5s
      retries: 60
volumes:
  mysql_tls:
  mysql_ca:
  originals:
  thumbnails:
  database:
